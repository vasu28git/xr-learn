<style>
        .glass-panel {
            background: rgba(21, 25, 33, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #2D333B;
        }
        .input-glow:focus {
            box-shadow: inset 0 0 0 1px #8ed5ff;
            outline: none;
            border-color: transparent;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Decorative background elements -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: radial-gradient(circle at 50% 50%, rgba(142, 213, 255, 0.15) 0%, transparent 50%);"></div>
<div class="absolute top-0 left-0 w-full h-full z-0 pointer-events-none opacity-5" style="background-image: linear-gradient(rgba(142, 213, 255, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(142, 213, 255, 0.2) 1px, transparent 1px); background-size: 40px 40px;"></div>
<main class="relative z-10 w-full max-w-md px-margin">
<div class="glass-panel rounded-xl p-8 flex flex-col items-center">
<!-- Logo & Header -->
<div class="mb-8 flex flex-col items-center text-center">
<img alt="Multiverse 3D Logo" class="w-16 h-16 object-contain mb-4" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtOTbpz51u71Hvf_uHPZmHrtxLcjmxuydOvmkN_azvNvrgQc-maFuicqOeFpwzdLEYC5y_F_X8VdvHcy-nCNp-84HQIwNNEiJpNx5kh7KegDZ5WbN-6E-MarnNrqFE8TW2AusuXHCcA63FLz6_PseZ1blbyVKhK_jLrRFL7wx09SFn7sUmngOkdJ3wzZruMtO3OjnZmeS6PB5UgxQibLwUWlFl4WwHjlfd4mRwIJ5rMqEPOKDSUyZjrw"/>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight mb-2">Multiverse 3D</h1>
<p class="font-code-sm text-code-sm text-on-surface-variant tracking-wider uppercase">Learn XR. Build XR. Debug XR.</p>
</div>
<!-- Login Form -->
<form action="#" class="w-full space-y-gutter" method="POST">
<!-- Email Input -->
<div class="space-y-unit">
<label class="font-code-sm text-code-sm text-on-surface-variant block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT py-2 pl-10 pr-3 font-body-md text-on-surface placeholder-on-surface-variant/50 input-glow transition-all duration-200" id="email" name="email" placeholder="developer@multiverse.io" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-unit">
<div class="flex justify-between items-center">
<label class="font-code-sm text-code-sm text-on-surface-variant block" for="password">Password</label>
<a class="font-code-sm text-code-sm text-primary hover:text-primary-fixed transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-DEFAULT py-2 pl-10 pr-10 font-body-md text-on-surface placeholder-on-surface-variant/50 input-glow transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[18px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center pt-2">
<input class="h-4 w-4 rounded bg-surface-container-lowest border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest focus:ring-offset-2" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">
                        Remember session
                    </label>
</div>
<!-- Submit Button -->
<button class="w-full mt-6 bg-primary hover:bg-primary-fixed text-on-primary font-headline-sm text-headline-sm py-3 px-4 rounded-DEFAULT transition-colors duration-200 flex justify-center items-center gap-2" type="submit">
<span>Initialize Environment</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    No access token yet? 
                    <a class="text-primary hover:text-primary-fixed font-semibold transition-colors" href="#">Request Alpha Access</a>
</p>
</div>
</div>
</main>
<script>
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        });
    </script>
</body></html>
